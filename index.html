<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSDK WebXR Markerless Environmental Placement Mockup</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
        // Registering a custom system component to handle environmental placement
        AFRAME.registerComponent('markerless-hit-test', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.reticle = document.querySelector('#reticle');
                this.model = document.querySelector('#educational-model');
                this.el.sceneEl.addEventListener('enter-vr', () => {
                    let session = this.el.sceneEl.xrSession;
                    if (session) {
                        session.requestReferenceSpace('viewer').then((space) => {
                            this.viewerSpace = space;
                            session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                                this.xrHitTestSource = source;
                            });
                        });
                        session.requestReferenceSpace('local').then((space) => {
                            this.localSpace = space;
                        });
                    }
                });
            },
            tick: function () {
                let frame = this.el.sceneEl.frame;
                if (frame && this.xrHitTestSource && this.localSpace) {
                    let hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                    if (hitTestResults.length > 0) {
                        let pose = hitTestResults[0].getPose(this.localSpace);
                        this.reticle.setAttribute('visible', 'true');
                        this.reticle.object3D.position.copy(pose.transform.position);
                        this.reticle.object3D.quaternion.copy(pose.transform.orientation);
                    } else {
                        this.reticle.setAttribute('visible', 'false');
                    }
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #ui-container;" markerless-hit-test>
        <a-assets>
            <a-asset-item id="database-schema" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/StructureFormula/glTF-Binary/StructureFormula.glb"></a-asset-item>
        </a-assets>
        
        <a-entity id="reticle" visible="false">
            <a-ring color="#00FF00" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0"></a-ring>
        </a-entity>
        
        <a-entity id="educational-model" gltf-model="#database-schema" scale="0.2 0.2 0.2" position="0 0 -2"></a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>

    <div id="ui-container" style="position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 10;">
        <button onclick="window.location.href='https://forms.gle/fsdk_pilot_survey_hash'" style="padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Proceed to Topic Assessment
        </button>
    </div>
</body>
</html>
